[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-health-monitor"
version = "0.1.0"
description = "CLI network connectivity diagnostic tool"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Igor Caetano" }
]

[project.scripts]
netmonitor = "netmonitor.cli:main"
